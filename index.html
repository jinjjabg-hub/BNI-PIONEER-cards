<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNI Pioneer | 멤버 카드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
  .header { text-align: center; margin-bottom: 40px; }
  .bni-badge {
    display: inline-block;
    background: rgba(196,160,100,0.2);
    border: 1px solid rgba(196,160,100,0.5);
    color: #c4a064;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .header h1 { font-size: 28px; font-weight: 700; color: white; margin-bottom: 8px; }
  .header p { font-size: 13px; color: rgba(255,255,255,0.4); }
  .divider {
    width: 40px; height: 2px;
    background: linear-gradient(90deg, #c4a064, rgba(196,160,100,0.2));
    margin: 16px auto 0;
  }
  .grid { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
  .member-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    transition: all 0.3s;
    cursor: pointer;
  }
  .member-card:hover, .member-card:active {
    background: rgba(255,255,255,0.1);
    border-color: rgba(196,160,100,0.4);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .member-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(196,160,100,0.2);
    border: 2px solid rgba(196,160,100,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .member-info { flex: 1; }
  .member-name { font-size: 16px; font-weight: 700; color: white; margin-bottom: 4px; }
  .member-company { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
  .member-tag {
    display: inline-block;
    background: rgba(196,160,100,0.15);
    border: 1px solid rgba(196,160,100,0.3);
    color: #c4a064;
    font-size: 10px; font-weight: 700;
    padding: 3px 10px; border-radius: 10px;
  }
  .arrow { color: rgba(255,255,255,0.3); font-size: 18px; flex-shrink: 0; }
  .member-count { text-align: center; margin-top: 32px; font-size: 12px; color: rgba(255,255,255,0.25); letter-spacing: 0.1em; }
</style>
</head>
<body>

<div class="header">
  <div class="bni-badge">BNI PIONEER CHAPTER</div>
  <h1>멤버 카드</h1>
  <p>디지털 명함 모음</p>
  <div class="divider"></div>
</div>

<div class="grid">

  <a class="member-card" href="https://jinjjabg-hub.github.io/BNI-PIONEER-cards/김지현">
    <div class="member-avatar">🏡</div>
    <div class="member-info">
      <div class="member-name">김지현 대표</div>
      <div class="member-company">감성온도 | 숙박 공간 컨설팅</div>
      <div class="member-tag">8기 부의장</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="member-card" href="https://jinjjabg-hub.github.io/BNI-PIONEER-cards/송승훈">
    <div class="member-avatar">🍖</div>
    <div class="member-info">
      <div class="member-name">송승훈 대표</div>
      <div class="member-company">토마랩 | 식당 컨설팅</div>
      <div class="member-tag">5·6기 의장</div>
    </div>
    <div class="arrow">›</div>
  </a>

</div>

<div class="member-count">현재 2명 · 멤버 추가 예정</div>

</body>
</html>
