<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNI Pioneer | 디지털 명함 디렉토리</title>

<meta property="og:title" content="BNI Pioneer 디지털 명함">
<meta property="og:description" content="BNI 파이오니어 챕터 멤버 디지털 명함 디렉토리">
<meta property="og:url" content="https://jinjjabg-hub.github.io/BNI-PIONEER-cards/">
<meta property="og:type" content="website">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f5f0ff;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(180,160,255,0.25) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(255,180,200,0.2) 0%, transparent 50%);
    min-height: 100vh;
    padding: 48px 16px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }
  header .badge {
    display: inline-block;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(150,100,255,0.3);
    color: #5b30cc;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 5px 16px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: #2d1a5e;
    margin-bottom: 6px;
  }
  header p {
    font-size: 13px;
    color: #7a6a9a;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
  }

  .member-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(90,50,200,0.1);
    text-decoration: none;
    display: block;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }
  .member-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 48px rgba(90,50,200,0.18);
  }

  .card-hero {
    height: 140px;
    position: relative;
    overflow: hidden;
  }
  .card-hero img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 30%;
  }
  .card-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 30%, rgba(30,15,60,0.6) 100%);
  }
  .hero-name {
    position: absolute;
    bottom: 14px;
    left: 18px;
    z-index: 2;
    color: white;
    font-size: 18px;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .hero-color {
    width: 100%; height: 100%;
  }

  .card-body {
    padding: 18px 18px 20px;
  }
  .card-company {
    font-size: 15px;
    font-weight: 700;
    color: #2d1a5e;
    margin-bottom: 4px;
  }
  .card-role {
    font-size: 12px;
    color: #8878aa;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #6640dd;
    background: #f0eaff;
    padding: 6px 14px;
    border-radius: 20px;
    transition: background 0.2s;
  }
  .member-card:hover .card-link {
    background: #e0d4ff;
  }
  .card-link::after { content: '→'; }

  footer {
    text-align: center;
    margin-top: 48px;
    font-size: 11px;
    color: #b0a8c8;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<header>
  <div class="badge">BNI PIONEER CHAPTER</div>
  <h1>디지털 명함 디렉토리</h1>
  <p>멤버를 선택하면 디지털 명함으로 이동합니다</p>
</header>

<div class="grid">
 
  <!-- 송승훈 -->
  <a class="member-card" href="./송승훈/">
    <div class="card-hero"> 
     <img src="https://imgur.com/a/Wn48AMx">
      <div class="hero-name">송승훈</div>
    </div>
    <div class="card-body">
      <div class="card-company">T.M Link</div>
      <div class="card-role">웹·앱 개발 컨설팅<br>BNI Pioneer 5·6기 의장</div>
      <span class="card-link">명함 보기</span>
    </div>
  </a>
  <!-- 김지현 -->
  <a class="member-card" href="./김지현/">
    <div class="card-hero">
      <img src="https://i.imgur.com/S6POM8H.jpeg" alt="감성온도">
      <div class="hero-name">김지현</div>
    </div>
    <div class="card-body">
      <div class="card-company">감성온도</div>
      <div class="card-role">공간 디렉터 · 숙박 공간 컨설팅<br>BNI Pioneer 8기 부의장</div>
      <span class="card-link">명함 보기</span>
    </div>
  </a>
  <!-- 이화춘 -->
  <a class="member-card" href="./이화춘/">
    <div class="card-hero" >
     <img src="https://imgur.com/a/mOOKSAe">
      <div class="hero-name">이화춘</div>
    </div>
    <div class="card-body">
      <div class="card-company">이화춘 뷰티랩-</div>
      <div class="card-role">BNI Pioneer 8기 성장코디</div>
      <span class="card-link">명함 보기</span>
    </div>
  </a>
  <!-- 김경태 -->
  <a class="member-card" href="./김경태/">
    <div class="card-hero" >
      <img src="https://imgur.com/a/qPaCSRN" alt="늘곁에 라이프온(주)">
      <div class="hero-name">김경태</div>
    </div>
    <div class="card-body">
      <div class="card-company">늘곁에 라이프온(주)-</div>
      <div class="card-role">BNI Pioneer 멤버</div>
      <span class="card-link">명함 보기</span>
    </div>
  </a>
</div>

<footer>© BNI Pioneer Chapter · Digital Cards by T.M</footer>

</body>
</html>
