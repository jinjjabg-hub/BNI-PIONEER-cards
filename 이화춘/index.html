<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>이화춘 뷰티랩 | 이화춘 대표</title>
<meta property="og:title" content="이화춘 뷰티랩 | 이화춘 대표">
<meta property="og:image" content="https://jinjjabg-hub.github.io/BNI-PIONEER-cards/%EC%9D%B4%ED%99%94%EC%B6%98/og-image.jpg">
<style>
@font-face{font-family:'P';font-weight:400;src:url('../fonts/PAPERLOGY-4REGULAR.TTF') format('truetype');}
@font-face{font-family:'P';font-weight:700;src:url('../fonts/PAPERLOGY-7BOLD.TTF') format('truetype');}
@font-face{font-family:'P';font-weight:900;src:url('../fonts/PAPERLOGY-9BLACK.TTF') format('truetype');}
@font-face{font-family:'A';src:url('../fonts/ABRILFATFACE-REGULAR.TTF') format('truetype');}
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#C8922A;--g2:#D4A640;--g3:#E8C870;--bg:#111;--bg2:#1A1209;--card:#1E1508;--bd:rgba(200,146,42,.2);--tx:#E8D8B0;--mt:#8A7A60}
body{font-family:'P',sans-serif;font-weight:400;background:var(--bg);color:var(--tx);max-width:480px;margin:0 auto;overflow-x:hidden}
.lang-bar{position:sticky;top:0;z-index:999;background:rgba(17,17,17,.95);backdrop-filter:blur(10px);padding:10px 16px;display:flex;gap:8px;border-bottom:1px solid var(--bd)}
.lb{background:none;border:1px solid rgba(200,146,42,.3);color:rgba(255,255,255,.4);font-family:'P',sans-serif;font-size:11.5px;font-weight:700;padding:5px 14px;border-radius:4px;cursor:pointer;transition:.2s}
.lb.on{background:var(--g);border-color:var(--g);color:#fff}
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden}
.hero img.bg{width:100%;height:100%;object-fit:cover;object-position:center 12%;filter:brightness(.55)}
.hero-ov{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(17,9,2,.15) 0%,transparent 35%,rgba(17,9,2,.6) 68%,rgba(17,9,2,.97) 100%)}
.h-logo{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.5);border-radius:8px;padding:6px 8px;border:1px solid rgba(200,146,42,.25)}
.h-logo img{width:72px;display:block;opacity:.85}
.h-bot{position:absolute;bottom:0;left:0;right:0;padding:22px 22px 28px}
.h-sup{font-family:'A',serif;font-size:9.5px;letter-spacing:.3em;color:var(--g2);text-transform:uppercase;margin-bottom:10px;opacity:.9}
.h-name{font-family:'P',sans-serif;font-weight:900;font-size:44px;color:#fff;letter-spacing:.15em;line-height:1;margin-bottom:6px}
.h-sub{font-size:12px;color:rgba(255,255,255,.45);letter-spacing:.25em;margin-bottom:14px}
.h-pill{display:inline-flex;align-items:center;background:rgba(200,146,42,.15);border:1px solid rgba(200,146,42,.4);color:var(--g3);font-size:11.5px;font-weight:700;padding:6px 14px;border-radius:20px}
.sec{padding:28px 20px}
.sec+.sec{border-top:1px solid rgba(255,255,255,.06)}
.sec-label{font-family:'A',serif;font-size:10px;letter-spacing:.28em;color:var(--g);text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--bd)}
.sec-label.bold{font-family:'P',sans-serif;font-weight:900;font-size:13px;letter-spacing:.1em}
.about-title .line1{display:block;font-family:'P',sans-serif;font-weight:900;font-size:26px;color:#fff;line-height:1.3}
.about-title .line2{display:block;font-family:'P',sans-serif;font-weight:900;font-size:26px;color:var(--g2);line-height:1.3;margin-bottom:14px}
.about-body{font-size:13px;color:rgba(232,216,176,.75);line-height:1.9;margin-bottom:18px}
.num-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.num-card{background:var(--card);border-radius:10px;padding:14px 16px;display:flex;gap:14px;border:1px solid var(--bd)}
.num{font-family:'A',serif;font-size:20px;color:rgba(200,146,42,.25);line-height:1;flex-shrink:0;width:26px;padding-top:2px}
.num-body strong{display:block;font-size:14px;font-weight:700;color:var(--g3);margin-bottom:4px}
.num-body p{font-size:12.5px;color:rgba(232,216,176,.65);line-height:1.65}
.about-quote{font-size:13.5px;color:rgba(200,146,42,.7);font-style:italic;border-left:3px solid var(--g);padding:10px 14px;background:rgba(200,146,42,.06);border-radius:0 8px 8px 0}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.06)}
.stat-item{padding:18px 0;text-align:center}
.stat-item:nth-child(odd){border-right:1px solid rgba(255,255,255,.06)}
.stat-item:nth-child(n+3){border-top:1px solid rgba(255,255,255,.06)}
.stat-row{display:none}.stat-row.on{display:block}
.stat-num{font-family:'P',sans-serif;font-weight:900;font-size:26px;color:var(--g2);line-height:1}
.stat-num em{font-size:13px;font-style:normal;color:rgba(255,255,255,.3)}
.stat-label{font-size:11px;color:var(--mt);margin-top:5px;line-height:1.5}
.svc-title .line1{display:block;font-family:'P',sans-serif;font-weight:900;font-size:22px;color:#fff;line-height:1.3}
.svc-title .line2{display:block;font-family:'P',sans-serif;font-weight:900;font-size:22px;color:var(--g2);margin-bottom:16px}
.svc-list{display:flex;flex-direction:column}
.svc-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.svc-item:last-child{border-bottom:none}
.svc-icon{width:42px;height:42px;border-radius:50%;background:rgba(200,146,42,.12);border:1px solid rgba(200,146,42,.25);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.svc-body strong{display:block;font-size:14px;font-weight:700;color:var(--g3);margin-bottom:4px}
.svc-body p{font-size:12.5px;color:rgba(232,216,176,.65);line-height:1.65}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:7px 15px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--bd);font-size:12.5px;color:var(--g3)}
.tag-icon{margin-right:4px}
.bni-timeline{display:flex;align-items:flex-start;margin:16px 0 14px}
.bni-step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.bni-step:not(:last-child)::after{content:'——';position:absolute;top:14px;left:calc(50% + 14px);width:calc(100% - 28px);color:var(--g);font-size:11px;letter-spacing:-2px;text-align:center;line-height:1}
.bni-dot{width:30px;height:30px;border-radius:50%;background:rgba(200,146,42,.2);border:2px solid var(--g);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--g);margin-bottom:6px;position:relative;z-index:1}
.bni-dot.cur{background:var(--g);color:#000;box-shadow:0 0 12px rgba(200,146,42,.5)}
.bni-info{text-align:center}
.bni-ord{font-size:10px;color:rgba(255,255,255,.3)}
.bni-role{font-size:11px;color:var(--tx);margin-top:2px}
.bni-banner{background:rgba(200,146,42,.1);border:1px solid rgba(200,146,42,.3);border-radius:8px;padding:11px 14px;font-size:13px;color:var(--g3);display:flex;align-items:center;gap:8px}
.career-box{background:var(--bg2);border-radius:10px;border:1px solid var(--bd);overflow:hidden;margin-top:6px}
.career-scroll{max-height:240px;overflow-y:auto;padding:14px 16px}
.career-scroll::-webkit-scrollbar{width:3px}
.career-scroll::-webkit-scrollbar-thumb{background:var(--g);border-radius:2px}
.career-item{font-size:12.5px;color:var(--tx);line-height:1.7;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.career-item:last-child{border-bottom:none}
.career-item::before{content:'· ';color:var(--g)}
.space-badge-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.space-badge{display:inline-block;background:var(--g2);color:#000;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:4px;white-space:nowrap}
.space-title-txt{font-family:'P',sans-serif;font-weight:900;font-size:20px;color:#fff}
.space-imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.space-img{border-radius:10px;overflow:hidden;height:140px}
.space-img img{width:100%;height:100%;object-fit:cover}
.space-desc{font-size:13px;color:var(--mt);line-height:1.85}
.contact-wrap{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.btn-tel{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--g),#8A6010);color:#fff;text-decoration:none;padding:15px 20px;border-radius:12px;font-size:14.5px;font-weight:700}
.contact-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-link{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid rgba(255,255,255,.08);color:var(--tx);text-decoration:none;padding:13px 14px;border-radius:12px;font-size:13px;font-weight:700;transition:.15s}
.btn-link:hover{border-color:var(--g)}
.btn-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ic-home{background:#03C75A}.ic-ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.ic-yt{background:#cc0000}.ic-blog{background:#00A62B}.ic-store{background:rgba(200,146,42,.2);border:1px solid var(--bd)}
.btn-full{grid-column:1/-1}
.footer{background:#000;padding:20px;display:flex;justify-content:space-between;align-items:flex-end}
.f-brand{font-family:'A',serif;font-size:14px;color:rgba(255,255,255,.5);letter-spacing:.2em}
.f-sub{font-size:10.5px;color:var(--mt);margin-top:4px}
.footer-r{font-family:'A',serif;font-size:32px;color:var(--g);opacity:.35;line-height:1}
/* 언어 전환 */
.t{display:none}.t.on{display:inline}
.lang-block{display:none}.lang-block.on{display:block}

/* ═══ 추가된 명함 업그레이드 스킬 v2.1 CSS 섹션 ═══ */
.save-sec {
  background: var(--bg2);
  padding: 20px 24px;
  border-top: 1px solid var(--bd);
  border-bottom: 1px solid var(--bd);
}
.save-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.btn-save {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  transition: background 0.2s;
}
.btn-save:hover {
  background: rgba(200, 146, 42, 0.15);
}
.btn-save .icon {
  font-size: 15px;
}
</style></head><body>

<script>
function setLang(lang,btn){
  document.querySelectorAll('.lb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.t').forEach(el=>{
    if(el.classList.contains(lang)) el.classList.add('on');
    else el.classList.remove('on');
  });
  document.querySelectorAll('.lang-block').forEach(el=>{
    if(el.classList.contains('l-'+lang)) el.classList.add('on');
    else el.classList.remove('on');
  });
}

// ═══ 추가된 명함 업그레이드 스킬 v2.1 JavaScript 섹션 ═══
function getTelNumber() {
  const telLink = document.getElementById('main-tel-link');
  if (telLink && telLink.href) {
    return telLink.href.replace('tel:', '').trim();
  }
  return '010-0000-0000'; // 기본 대체 번호
}

function saveToContacts() {
  const telNum = getTelNumber();
  const vcardData = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:이;화춘;;;',
    'FN:이화춘 대표',
    'ORG:이화춘 뷰티랩;파이오니어 챕터',
    'TITLE:대표 (뷰티 · 교육)',
    'TEL;TYPE=CELL:' + telNum,
    'URL:' + window.location.href,
    'END:VCARD'
  ].join('\n');

  const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '이화춘_대표_연락처.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    title: '대표',
    company: '이화춘 뷰티랩',
    industry: '뷰티 · 교육',
    tel: telNum,
    chapter: '파이오니어 챕터',
    url: window.location.href,
    photo: 'profile.jpg',
    savedAt: new Date().toLocaleDateString('ko-KR')
  };

  let cards = JSON.parse(localStorage.getItem('bni_cards') || '[]');

  if (cards.find(c => c.id === card.id)) {
    alert('✅ 이미 명함첩에 저장되어 있어요!');
    return;
  }

  cards.push(card);
  localStorage.setItem('bni_cards', JSON.stringify(cards));

  if (confirm('✅ 명함첩에 저장되었습니다!\n명함첩 바로 보기?')) {
    window.location.href = '/명함첩.html';
  }
}
</script>
</body></html>
